const haku = new URLSearchParams(location.search);
setTimeout(() => {

  }
  pelaaja1.suojaAika = 0;
  window.requestAnimationFrame = () => {}; paivita = () => {}; // peli pysähtyy kuvaa varten
  setTimeout(() => { kameraHyppaa = true; paivitaKamera(1); piirra(f * 16); }, 100);
}, 300);
